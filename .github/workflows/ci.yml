name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Glob, não a lista: um arquivo de teste novo entra sozinho. Listar à mão
      # é o tipo de completude que depende de alguém lembrar — e o teste
      # test/kit.test.mjs cobra justamente isso.
      - name: suítes de teste (docscheck, mutação, kit, instalação)
        run: node --test test/*.test.mjs
      - name: as tabelas geradas (GRAMATICA §5 e README) em dia com o catálogo
        run: node scripts/gerar-gramatica.mjs --check
      - name: testes do fixture linkcheck (referência viva da gramática)
        run: node --test
        working-directory: examples/fixtures/linkcheck
      - name: testes do fixture pedidos (referência viva do DOMAIN.md)
        run: node --test
        working-directory: examples/fixtures/pedidos
      # `npm install` aqui só linka os dois workspaces entre si — o fixture não
      # tem dependência externa, e é o que faz `@tarifa/nucleo` resolver pelo
      # nome publicado em vez do caminho, que é justamente o que ele demonstra.
      - name: testes do fixture monorepo (referência viva do recipe por pacote)
        run: npm install --no-audit --no-fund && npm test
        working-directory: examples/fixtures/monorepo
      - name: docscheck estrito contra os doc-sets de referência (zero avisos)
        run: |
          node bin/docscheck.mjs --strict examples/fixtures/linkcheck
          node bin/docscheck.mjs --strict examples/fixtures/pedidos
          node bin/docscheck.mjs --strict examples/fixtures/monorepo
